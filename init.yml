stages:
  - stage: terraforminit
    displayName: Terraform Init
    jobs:
      - job: 
        steps:
        

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'grv-svc01'
            backendAzureRmStorageAccountName: 'stgrvhomerenovation'
            backendAzureRmContainerName: 'grvcontainer'
            backendAzureRmKey: 'dev.tfstate'